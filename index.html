<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сказочная карта России</title>
  <style>
    .map-container {
      position: relative;
      max-width: 100%;
      overflow: hidden;
    }
    .map-img {
      width: 100%;
      height: auto;
      display: block;
    }
    .hotspot {
      position: absolute;
      border: 2px solid rgba(255,255,255,0.6);
      transition: all 0.2s;
      cursor: pointer;
    }
    .hotspot:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }
    .tooltip {
      position: absolute;
      background: #fff;
      color: #000;
      padding: 6px 10px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 10;
    }
    .hotspot:hover .tooltip {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="map-container">
  <img src="https://sun9-12.vkuserphoto.ru/s/v1/ig2/qO-qgkS7pb___1Ge5p7GYLkQEUpe4v1MIIotQxuemhWo63Bgem2PecAFHmhdS-zxrEVoiZ6Ow0mZwZMurEI8S-fu.jpg?quality=95&as=32x27,48x40,72x61,108x91,160x135,240x202,360x303,480x404,540x454,640x538,720x605,1080x908,1280x1076,1440x1211,2181x1834&from=bu&u=uZRx2RkQDep6Rp3MtJVehi4Y-NBH8R39pCi1ZwQV1CE&cs=2181x0" alt="Карта России" class="map-img">

    <span class="tooltip">Русская народная сказка</span>
  </a>
